<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <title>计算机系统基础笔记</title>
  <style>
    /* =========================================================
       GitHub Dark Dimmed（soft dark）#22272e & Light 主题变量
       ========================================================= */
    :root, [data-theme="dark"] {
      --bg: #22272e;
      --bg-subtle: #2d333b;
      --bg-inset: #1c2128;
      --bg-hover: #373e47;
      --border: #444c56;
      --border-muted: #373e47;
      --fg: #adbac7;
      --fg-muted: #768390;
      --accent: #539bf5;
      --accent-emphasis: #316dca;
      --accent-subtle: rgba(65, 132, 228, 0.15);
      --success: #57ab5a;
      --success-emphasis: #347d39;
      --success-subtle: rgba(57, 171, 90, 0.15);
      --danger: #e5534b;
      --danger-subtle: rgba(229, 83, 75, 0.15);
      --attention: #c69026;
      --attention-subtle: rgba(174, 124, 20, 0.15);
      --done: #986ee2;
      --done-subtle: rgba(152, 110, 226, 0.15);
      --tab-active: #ec775c;
      --shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      --radius: 6px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }
    [data-theme="light"] {
      --bg: #ffffff;
      --bg-subtle: #f6f8fa;
      --bg-inset: #f6f8fa;
      --bg-hover: #eaeef2;
      --border: #d0d7de;
      --border-muted: #d8dee4;
      --fg: #1f2328;
      --fg-muted: #656d76;
      --accent: #0969da;
      --accent-emphasis: #0969da;
      --accent-subtle: #ddf4ff;
      --success: #1a7f37;
      --success-emphasis: #1f883d;
      --success-subtle: #dafbe1;
      --danger: #d1242f;
      --danger-subtle: #ffebe9;
      --attention: #9a6700;
      --attention-subtle: #fff8c5;
      --done: #8250df;
      --done-subtle: #fbefff;
      --tab-active: #fd8c73;
      --shadow: 0 16px 48px rgba(31, 35, 40, 0.25);
    }

    * { box-sizing: border-box; }
    html { scroll-padding-top: 20px; }
    body {
      margin: 0;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--fg);
      background: var(--bg);
      overflow-x: hidden;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; color: inherit; }
    code, kbd, pre { font-family: var(--mono); }
    .muted { color: var(--fg-muted); }
    .spacer { flex: 1; }
    .ic { width: 16px; height: 16px; flex: none; vertical-align: text-bottom; }
    .ov { display: inline-block; border-top: 1.25px solid currentColor; padding-top: 1px; line-height: 1.15; margin: 0 1px; }
    .ov > .ov { margin-top: 1px; }

    /* ---------- 位图图标（icons/ 下的同名资源；xxx_暗 用于深色主题） ---------- */
    .ico {
      display: inline-block;
      width: 16px; height: 16px; flex: none;
      background-repeat: no-repeat;
      /* 源图均为 500×500 但留白不同；用 --isz/--ipx/--ipy 把图形按最大边 90% 居中裁齐 */
      background-size: var(--isz, 90%) auto;
      background-position: var(--ipx, 50%) var(--ipy, 50%);
      vertical-align: -3px;
    }
    /* 导航类图标略放大，笔画更清晰 */
    .repo-nav .ico { width: 22px; height: 22px; vertical-align: middle; }
    .tree .ico, .tree .ic { width: 18px; height: 18px; vertical-align: -4px; }
    .ico.ico-lg { width: 28px; height: 28px; vertical-align: middle; }
    .ico.ico-md { width: 24px; height: 24px; vertical-align: middle; }
    .btn.icon-btn { padding: 0; width: 32px; height: 32px; justify-content: center; }
    .icon-btn .ico { width: 18px; height: 18px; }

    .ic-menu { background-image: url("icons/左上角菜单.png"); --isz: 144.7%; --ipx: 47.7%; --ipy: 29.9%; }
    .ic-theme { background-image: url("icons/亮暗切换.png"); --isz: 155.7%; --ipx: 50.3%; --ipy: 50%; }
    .ic-chapter { background-image: url("icons/章节.png"); --isz: 158.5%; --ipx: 50%; --ipy: 50%; }
    .ic-quiz { background-image: url("icons/练习.png"); --isz: 158.5%; --ipx: 50%; --ipy: 50%; }
    .ic-team { background-image: url("icons/分工.png"); --isz: 145.2%; --ipx: 50%; --ipy: 50%; }
    .ic-actions { background-image: url("icons/Actions.png"); --isz: 174.4%; --ipx: 50%; --ipy: 50%; }
    /* 文件夹保留实心风格；用 48px 预渲染小图，避免 500px 缩到 14px 发糊 */
    .ic-folder { background-image: url("icons/文件夹图标_small.png"); --isz: 100%; --ipx: 50%; --ipy: 50%; }
    .ic-file { background-image: url("icons/ic_baseline-text-snippet-removebg-preview.png"); --isz: 194%; --ipx: 50%; --ipy: 50%; }
    .ic-logo { background-image: url("icons/笔记主图标.png"); --isz: 174.4%; --ipx: 49.8%; --ipy: 50%; }
    .ic-reset { background-image: url("icons/清空全部进度.png"); --isz: 204.5%; --ipx: 50%; --ipy: 47.3%; }

    [data-theme="dark"] .ic-menu { background-image: url("icons/左上角菜单_暗.png"); --isz: 145.2%; --ipx: 50%; --ipy: 50%; }
    [data-theme="dark"] .ic-theme { background-image: url("icons/亮暗切换_暗.png"); --isz: 146.6%; --ipx: 50%; --ipy: 50.3%; }
    [data-theme="dark"] .ic-chapter { background-image: url("icons/章节_暗.png"); --isz: 158.5%; --ipx: 50%; --ipy: 50%; }
    [data-theme="dark"] .ic-quiz { background-image: url("icons/练习_暗.png"); --isz: 159%; --ipx: 49.7%; --ipy: 49.7%; }
    [data-theme="dark"] .ic-team { background-image: url("icons/分工_暗.png"); --isz: 145.2%; --ipx: 50%; --ipy: 50.3%; }
    [data-theme="dark"] .ic-actions { background-image: url("icons/Actions_暗.png"); --isz: 174.4%; --ipx: 50%; --ipy: 50%; }
    [data-theme="dark"] .ic-folder { background-image: url("icons/文件夹图标_暗.png"); --isz: 174.4%; --ipx: 50%; --ipy: 50%; }
    [data-theme="dark"] .ic-logo { background-image: url("icons/笔记主图标_暗.png"); --isz: 174.4%; --ipx: 49.8%; --ipy: 50%; }
    [data-theme="dark"] .ic-reset { background-image: url("icons/清空全部进度_暗.png"); --isz: 210.3%; --ipx: 50%; --ipy: 48.5%; }

    /* 深色模式下 Actions / 文件夹 / 笔记主图标 / 文档图标反相为白色版本 */
    [data-theme="dark"] .ic-actions,
    [data-theme="dark"] .ic-folder,
    [data-theme="dark"] .ic-logo,
    [data-theme="dark"] .ic-file { filter: invert(1); }

    /* ---------- 页面主容器 ---------- */
    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body.drawer-open .page-wrap {
      pointer-events: none;
      user-select: none;
    }

    /* ---------- 顶部全局 Header（对齐 GitHub 截图） ---------- */
    .gh-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }
    .menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--fg-muted);
      cursor: pointer;
      transition: 0.15s;
      flex: none;
    }
    .menu-btn:hover { color: var(--fg); border-color: var(--fg-muted); background: var(--bg-hover); }
    .gh-logo { color: var(--fg); display: flex; flex: none; }
    .gh-context { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; overflow: hidden; }
    .gh-context a { color: var(--fg); }
    .gh-context a:hover { color: var(--accent); }
    .gh-context .sep { color: var(--fg-muted); }

    .gh-search { position: relative; margin-left: auto; width: 320px; max-width: 42vw; }
    .gh-search input {
      width: 100%;
      padding: 5px 32px 5px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-size: 13px;
      outline: none;
      transition: 0.15s;
    }
    .gh-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
    .gh-search kbd {
      position: absolute; right: 8px; top: 5px;
      font-size: 11px; border: 1px solid var(--border);
      color: var(--fg-muted); border-radius: 4px; padding: 0 5px; pointer-events: none;
    }
    .search-pop {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: var(--bg-subtle); color: var(--fg);
      border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); z-index: 60; max-height: 420px; overflow: auto;
    }
    .search-pop a { display: block; padding: 8px 12px; color: var(--fg); border-bottom: 1px solid var(--border-muted); }
    .search-pop a:last-child { border-bottom: 0; }
    .search-pop a:hover, .search-pop a.on { background: var(--accent-emphasis); color: #fff; text-decoration: none; }
    .search-pop a:hover .muted, .search-pop a.on .muted { color: #e6edf3; }
    .search-pop .s-title { font-weight: 600; }
    .search-pop .s-snip { font-size: 12px; }
    .search-pop mark { background: var(--attention-subtle); color: var(--attention); border-radius: 2px; padding: 0 2px; }
    .search-pop .empty { padding: 12px; }

    /* ---------- 仓库标题栏 + 导航 Tabs ---------- */
    .repo-head {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px 0;
    }
    .repo-nav {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    .repo-nav a {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 12px;
      font-size: 16px;
      color: var(--fg);
      white-space: nowrap;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .repo-nav a:hover { text-decoration: none; background: var(--bg-hover); }
        .repo-nav a.active::after {
      content: ""; position: absolute; left: 8px; right: 8px; bottom: 0;
      height: 2px; background: var(--tab-active); border-radius: 2px;
    }
    .counter {
      display: inline-block; min-width: 20px; padding: 0 6px;
      font-size: 12px; font-weight: 500; line-height: 18px; text-align: center;
      background: rgba(110, 118, 129, 0.35); border-radius: 2em; color: var(--fg);
    }

    /* ---------- 弹出式侧边导航抽屉（圆角 + 清晰色彩遮罩，对齐 GitHub） ---------- */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(1, 4, 9, 0.5);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    [data-theme="light"] .backdrop {
      background: rgba(140, 149, 159, 0.28);
    }
    body.drawer-open .backdrop { opacity: 1; pointer-events: auto; }

    .drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 340px;
      max-width: 88vw;
      background: var(--bg-subtle);
      border-right: 1px solid var(--border);
      border-radius: 0 12px 12px 0;
      overflow: hidden;
      box-shadow: var(--shadow);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="light"] .drawer {
      background: var(--bg);
    }
    body.drawer-open .drawer { transform: translateX(0); }

    .drawer-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head b { font-size: 14px; }
    .drawer-close {
      margin-left: auto;
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--bg-hover); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--fg-muted); cursor: pointer;
    }
    .drawer-close:hover { color: var(--fg); border-color: var(--fg-muted); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 12px 10px 24px; }
    .drawer-prog { padding: 0 8px 12px; border-bottom: 1px solid var(--border-muted); margin-bottom: 10px; }

    .tree { display: flex; flex-direction: column; gap: 2px; }
    .tree-item, .tree-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 8px; border-radius: var(--radius);
      color: var(--fg); cursor: pointer; user-select: none; position: relative; font-size: 13px;
    }
    .tree-item:hover, .tree-row:hover { background: var(--bg-hover); text-decoration: none; }
    .tree-item.active, .tree-row.active { background: var(--accent-subtle); color: var(--accent); font-weight: 600; }
    .tree-item.active::before, .tree-row.active::before {
      content: ""; position: absolute; left: -6px; top: 4px; bottom: 4px;
      width: 3px; border-radius: 3px; background: var(--accent);
    }
    .tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tree-children { display: none; padding-left: 16px; }
    .tree-folder.open > .tree-children { display: block; }
    .caret { width: 16px; height: 16px; flex: none; color: var(--fg-muted); transition: transform 0.15s; border-radius: 4px; }
    .caret:hover { background: var(--border); }
    .tree-folder.open > .tree-row > .caret { transform: rotate(90deg); }
    .tree-badge { font-size: 11px; padding: 0 6px; border-radius: 2em; flex: none; }
    .tree-badge.ok { background: var(--success-subtle); color: var(--success); }
    .tree-badge.ing { background: var(--attention-subtle); color: var(--attention); }
    .tree-sublist { padding-left: 14px; border-left: 1px solid var(--border); margin: 2px 0 4px 10px; }
    .tree-sub { display: block; padding: 3px 8px; font-size: 12px; color: var(--fg-muted); border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-sub:hover { color: var(--fg); background: var(--bg-hover); text-decoration: none; }

    /* ---------- 主内容区（宽屏全比例舒展，不再挤在中间） ---------- */
    .main {
      flex: 1;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 32px 64px;
    }

    /* ---------- 通用盒子 / 按钮 / 进度条 ---------- */
    .box { border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); margin-bottom: 16px; overflow: hidden; }
    .box-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 16px; background: var(--bg-subtle);
      border-bottom: 1px solid var(--border); flex-wrap: wrap;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; font-size: 13px; font-weight: 500; line-height: 20px;
      color: var(--fg); background: var(--bg-hover);
      border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; transition: 0.15s; white-space: nowrap;
    }
    .btn:hover { background: var(--border); text-decoration: none; }
    .btn-primary { color: #fff; background: var(--success-emphasis); border-color: rgba(240, 246, 252, 0.1); }
    .btn-primary:hover { background: #2ea043; }
    .btn-sm { padding: 3px 10px; font-size: 12px; }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
    .input {
      padding: 6px 12px; font-size: 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      outline: none; background: var(--bg-inset); color: var(--fg);
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-subtle); }
    .avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%;
      color: #fff; font-size: 11px; font-weight: 600; flex: none;
    }
    .avatar.lg { width: 32px; height: 32px; font-size: 14px; }
    .label { display: inline-block; padding: 0 8px; font-size: 12px; font-weight: 500; line-height: 18px; border-radius: 2em; border: 1px solid transparent; white-space: nowrap; }
    .progress { height: 8px; background: var(--bg-hover); border-radius: 6px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--success); border-radius: 6px; transition: width 0.4s ease; }

    /* ---------- 首页 ---------- */
    .home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 24px; }
    .toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .stat { display: inline-flex; align-items: center; gap: 4px; color: var(--fg-muted); }
    .toolbar .stat b { color: var(--fg); }
    .file-row { display: flex; align-items: center; gap: 12px; padding: 9px 16px; border-top: 1px solid var(--border-muted); }
    .file-row:first-of-type { border-top: 0; }
    .file-row:hover { background: var(--bg-subtle); }
    .file-row .fname { width: 280px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .fname a { color: var(--fg); }
    .file-row .fname a:hover { color: var(--accent); }
    .file-row .fmsg { flex: 1; color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .fdate { color: var(--fg-muted); white-space: nowrap; font-size: 12px; }
    .side-block { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border-muted); }
    .side-block:last-child { border-bottom: 0; }
    .side-block h3 { font-size: 15px; margin: 0 0 10px; }
    .topics { display: flex; flex-wrap: wrap; gap: 6px; }
    .topic { background: var(--accent-subtle); color: var(--accent); font-size: 12px; font-weight: 500; padding: 0 10px; line-height: 22px; border-radius: 2em; }
    .topic:hover { background: var(--accent-emphasis); color: #fff; text-decoration: none; }
    .contrib { display: flex; flex-wrap: wrap; gap: 10px; }
    .contrib a { display: flex; align-items: center; gap: 6px; color: var(--fg); }

    /* ---------- 章节页（包含本节快速跳转目录 + 正文） ---------- */
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 14px; flex-wrap: wrap; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .seg a { padding: 4px 14px; color: var(--fg); font-weight: 500; display: inline-flex; gap: 6px; align-items: center; }
    .seg a + a { border-left: 1px solid var(--border); }
    .seg a:hover { background: var(--bg-hover); text-decoration: none; }
    .seg a.on { background: var(--bg); box-shadow: inset 0 -2px 0 var(--tab-active); }

    .sec-pills { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; background: var(--bg-inset); border-bottom: 1px solid var(--border); }
    .sec-pills a {
      font-size: 12px; padding: 3px 10px; border-radius: 2em;
      border: 1px solid var(--border); color: var(--fg-muted); background: var(--bg-subtle);
    }
    .sec-pills a:hover, .sec-pills a.on { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); text-decoration: none; }

    .pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; }
    .pager a { flex: 1; max-width: 48%; border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; color: var(--fg); background: var(--bg-subtle); }
    .pager a:hover { border-color: var(--accent); text-decoration: none; }
    .pager a.next { text-align: right; margin-left: auto; }
    .pager small { display: block; color: var(--fg-muted); }

    /* ---------- Markdown 正文排版（统一风格） ---------- */
    .markdown-body { padding: 28px 36px 36px; font-size: 15px; line-height: 1.75; word-wrap: break-word; }
    .markdown-body h1 { font-size: 1.9em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-muted); margin: 0 0 16px; line-height: 1.3; }
    .markdown-body h2 { font-size: 1.45em; padding-bottom: 0.3em; border-bottom: 1px solid var(--border-muted); margin: 36px 0 16px; line-height: 1.3; position: relative; }
    .markdown-body h3 { font-size: 1.15em; margin: 22px 0 10px; color: var(--accent); }
    .markdown-body p, .markdown-body ul, .markdown-body ol, .markdown-body table, .markdown-body blockquote { margin: 0 0 14px; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.8em; }
    .markdown-body li + li { margin-top: 0.25em; }
    .markdown-body code { padding: 0.15em 0.4em; font-size: 88%; background: rgba(110, 118, 129, 0.25); border-radius: 5px; }
    .markdown-body pre { padding: 14px 16px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; font-size: 13px; line-height: 1.5; }
    .markdown-body pre code { background: none; padding: 0; }
    .markdown-body table { border-collapse: collapse; width: 100%; max-width: 100%; overflow: auto; margin-bottom: 16px; }

          sim.querySelector('[data-bit="A"]').textContent = 'A = ' + A;
          sim.querySelector('[data-bit="A"]').classList.toggle('hi', A === 1);

          sim.querySelector('[data-bit="B"]').classList.toggle('hi', B === 1);
          out.innerHTML = `<table><thead><tr><th>与 (AB)</th><th>或 (A+B)</th><th>非 (<span class="ov">A</span>)</th><th>与非 (<span class="ov">AB</span>)</th><th>或非 (<span class="ov">A+B</span>)</th><th>异或 (A⊕B)</th><th>同或 (A⊙B)</th></tr></thead>
            <tbody><tr><td><b>${A & B}</b></td><td><b>${A | B}</b></td><td><b>${1 - A}</b></td><td><b>${1 - (A & B)}</b></td><td><b>${1 - (A | B)}</b></td><td><b>${A ^ B}</b></td><td><b>${1 - (A ^ B)}</b></td></tr></tbody></table>`;
        };
        sim.querySelector('[data-bit="A"]').onclick = () => { A ^= 1; draw(); };
        sim.querySelector('[data-bit="B"]').onclick = () => { B ^= 1; draw(); };
        draw();
      }
      const km = root.querySelector('#kmap-grid');
      if (km) {

        const vals = Array(16).fill(0);
        [1, 3, 5, 7, 13, 15].forEach(i => vals[i] = 1);

          grays.forEach((ra) => {
            h += `<div class="kh">${ra}</div>`;
            grays.forEach((ca) => {

              const v = vals[idx];
              h += `<button type="button" class="kc ${v === 1 ? 'v1' : v === '×' ? 'vx' : ''}" data-i="${idx}">${v}</button>`;
            });
          });
          km.innerHTML = h + '</div>';
          const mins = vals.map((v, i) => v === 1 ? i : -1).filter(i => i >= 0);
          info.innerHTML = `当前最小项：<code>∑m(${mins.join(', ') || '∅'})</code>（点击方格可在 0 / 1 / × 之间切换）`;
          km.querySelectorAll('.kc').forEach(b => b.onclick = () => {
            const i = +b.dataset.i;
            vals[i] = vals[i] === 0 ? 1 : vals[i] === 1 ? '×' : 0;

          });
        };

      }
    }

  function enhance(root) {
    $$('.tabs', root).forEach(tabs => {
      const panes = Array.from(tabs.children).filter(el => el.dataset.tab);
      const bar = document.createElement('div');
      bar.className = 'tab-bar';
      panes.forEach((pane, i) => {
        pane.classList.add('tab-pane');
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = pane.dataset.tab;
        b.onclick = () => panes.forEach((q, j) => { q.hidden = j !== i; bar.children[j].classList.toggle('on', j === i); });
        bar.appendChild(b);
      });
      tabs.prepend(bar);
      if (bar.children[0]) bar.children[0].click();
    });
    $$('.picker', root).forEach(pk => {
      const out = $('.picker-out', pk), items = $$('.pick', pk);
      items.forEach(it => it.onclick = () => {
        items.forEach(x => x.classList.remove('on'));
        it.classList.add('on');
        if (!out) return;
        out.innerHTML = it.dataset.info;
        out.classList.remove('pop', 'muted'); void out.offsetWidth; out.classList.add('pop');
      });
    });
    $$('.term', root).forEach(t => {
      t.tabIndex = 0;
      t.onclick = e => {
        e.stopPropagation();

        if (!was) t.classList.add('show');
      };
    });
    $$('ol.steps', root).forEach(ol => {
      const items = $$('li', ol); let n = 0;
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn btn-sm steps-btn';

        items.forEach((li, i) => li.classList.toggle('step-hidden', i >= n));
        btn.textContent = n < items.length ? `▶ 下一步（${n}/${items.length}）` : '↺ 重新演示';
      };
      btn.onclick = () => { n = n < items.length ? n + 1 : 0; upd(); };
      ol.after(btn); upd();
    });
  }

            return { href: last.hash || `#/ch/${lc.id}/${last.secIdx}`, text: `▶ 继续学习第${lc.id}章 ${secNum}` };
          }
          return { href: `#/ch/${lc.id}`, text: `▶ 继续学习第${lc.id}章` };
        }
      }
    }
    const pst = chapterStats(pendingCh, p);
    const verb = pst.answered > 0 ? '继续学习' : '开始学习';
    return { href: `#/ch/${pendingCh.id}`, text: `▶ ${verb}第${pendingCh.id}章` };
  }

  /* ---------- 首页 ---------- */
  function renderHome() {
    const s = allStats();
    const act = getStudyAction();
    const totalSubs = CHAPTERS.reduce((n, c) => n + c.sections.reduce((m, sec) => m + sec.subs.length, 0), 0);
    main.innerHTML = `
      <div class="home-grid">
        <div>
          <div class="toolbar">
            <button class="btn btn-sm" type="button" id="openTreeShortcut"><span class="ico ic-menu" aria-hidden="true"></span>打开章节目录</button>
            <span class="stat">${I.folder}<b>${CHAPTERS.length}</b> 章</span>
            <span class="stat">${I.file}<b>${totalSubs}</b> 个小节</span>
            <span class="stat">${I.issue}<b>${s.total}</b> 道练习</span>
            <span class="spacer"></span>
            <a class="btn btn-primary" href="${act.href}">${esc(act.text)}</a>
          </div>
          <div class="box">
            <div class="box-header">${avatar('ry7oll')}<b>ry7oll</b><span class="muted">同步《数字逻辑 / 开关理论》全部章节目录</span><span class="spacer"></span><span class="muted">2026-11-18</span></div>
            ${CHAPTERS.map(c => {
              const st = chapterStats(c);
              return `<div class="file-row">${I.folder}
                <div class="fname"><a href="#/ch/${c.id}">第${c.id}章 ${esc(c.title)}</a></div>
                <div class="fmsg">${avatar(c.author)} ${esc(c.summary)}</div>
                <div class="fdate">${st.correct}/${st.total} ✓</div></div>`;
            }).join('')}
            <div class="file-row">${I.file}<div class="fname"><a href="#/team">小组分工说明.md</a></div><div class="fmsg">4 位成员分工与具体贡献</div><div class="fdate">${TEAM.length} 人</div></div>
          </div>
          <div class="box">
            <div class="box-header"><span class="ico ic-chapter" aria-hidden="true"></span><b>README.md</b></div>
            <article class="markdown-body">
              <h1>《数字逻辑 / 开关理论》课堂笔记</h1>
              <p class="lead">点击左上角 <b>☰</b> 按钮可从左侧弹出高亮章节目录（背景自动虚化暗淡，方便专注选章）。页面支持术语悬停提示、例题折叠解析、选项卡、逻辑门与卡诺图交互、以及课后练习即时判题。</p>
              <h2>课程章节结构</h2>
              <table><thead><tr><th>章节</th><th>核心节次</th><th>小节数</th><th>负责人</th></tr></thead><tbody>
                ${CHAPTERS.map(c => `<tr><td><a href="#/ch/${c.id}">第${c.id}章 ${esc(c.title)}</a></td><td>${c.sections.map(x => esc(x.title)).join('、')}</td><td>${c.sections.reduce((m, s) => m + s.subs.length, 0)}</td><td>${avatar(c.author)} ${esc(c.author)}</td></tr>`).join('')}
              </tbody></table>
            </article>
          </div>
        </div>
        <aside>
          <div class="side-block">
            <h3>课程标签</h3>
            <div class="topics">${['开关理论', '二进制', '布尔代数', '卡诺图', '组合逻辑', '时序逻辑', '触发器'].map(t => `<a class="topic" href="#/" data-search="${t}">${t}</a>`).join('')}</div>
          </div>
          <div class="side-block">
            <h3>整体学习进度</h3>
            <div class="progress" style="margin-bottom:6px"><span style="width:${pct(s.correct, s.total)}%"></span></div>
            <div class="muted">已答对 <b style="color:var(--fg)">${s.correct}</b> / ${s.total} 题 · <a href="#/actions">查看 Actions</a></div>
          </div>
          <div class="side-block">
            <h3>小组成员 <span class="counter">${TEAM.length}</span></h3>
            <div class="contrib">${TEAM.map(m => `<a href="#/team">${avatar(m.name, 'lg')}<span>${esc(m.name)}</span></a>`).join('')}</div>
          </div>
        </aside>
      </div>`;
    $('#openTreeShortcut').onclick = openDrawer;
    $$('[data-search]', main).forEach(a => a.onclick = e => { e.preventDefault(); $('#searchInput').value = a.dataset.search; $('#searchInput').focus(); doSearch(); });
  }

  /* ---------- 章节页 ---------- */
  function renderChapter(id, secIdx, subIdx) {
    const c = CHAPTERS.find(x => x.id === id);
    if (!c) return renderHome();
    lastStudy.set({ chId: c.id, secIdx, subIdx, hash: location.hash || `#/ch/${c.id}` });
    const mode = secIdx === 'quiz' ? 'quiz' : 'notes';
    const idx = CHAPTERS.indexOf(c);
    const prev = CHAPTERS[idx - 1], next = CHAPTERS[idx + 1];
    main.innerHTML = `
      <div class="breadcrumb">
        <button class="btn btn-sm" type="button" id="chMenuBtn"><span class="ico ic-menu" aria-hidden="true"></span>目录</button>
        <a href="#/">计算机系统基础笔记</a> / <b>第${c.id}章 ${esc(c.title)}</b>
      </div>
      <div class="box">
        <div class="box-header">
          <div class="seg"><a class="${mode === 'notes' ? 'on' : ''}" href="#/ch/${c.id}">笔记正文</a><a class="${mode === 'quiz' ? 'on' : ''}" href="#/ch/${c.id}/quiz">课后练习 <span class="counter">${c.quiz.length}</span></a></div>
          <span class="spacer"></span>
          ${avatar(c.author)}<span class="muted">${esc(c.author)} · ${c.sections.length} 节 · ${c.quiz.length} 题</span>
        </div>
        ${mode === 'notes' ? `<div class="sec-pills">${c.sections.map((s, i) => `<a href="#/ch/${c.id}/${i}" class="${secIdx === String(i) ? 'on' : ''}">${esc(s.title)}</a>`).join('')}</div>` : ''}
        <article class="markdown-body" id="content"></article>
      </div>
      <div class="pager">
        ${prev ? `<a href="#/ch/${prev.id}"><small>← 上一章</small>第${prev.id}章 ${esc(prev.title)}</a>` : ''}
        ${next ? `<a class="next" href="#/ch/${next.id}"><small>下一章 →</small>第${next.id}章 ${esc(next.title)}</a>` : ''}
      </div>`;
    $('#chMenuBtn').onclick = openDrawer;
    const content = $('#content');
    if (mode === 'notes') {
      content.innerHTML = `<h1>第${c.id}章 ${esc(c.title)}</h1><p class="lead">${esc(c.intro)}</p>` +
        c.sections.map((s, i) => `
          <section class="note-sec" id="sec-${i}">
            <h2>${esc(s.title)}</h2>
            ${s.subs.map((sb, j) => `<div class="sub-block" id="sub-${i}-${j}"><h3>${esc(sb.title)}</h3>${sb.html}</div>`).join('')}
          </section>`).join('') +
        `<div class="callout tip"><b>本章学完了？</b><a href="#/ch/${c.id}/quiz">去做第${c.id}章课后练习（${c.quiz.length} 题）→</a></div>`;
      enhance(content);
      if (typeof c.mount === 'function') c.mount(content);
      if (secIdx !== undefined && secIdx !== '') {
        const target = subIdx !== undefined ? document.getElementById(`sub-${secIdx}-${subIdx}`) : document.getElementById(`sec-${secIdx}`);
        if (target) setTimeout(() => { target.scrollIntoView({ behavior: 'smooth' }); target.classList.add('flash'); }, 30);
      }
    } else {
      renderQuiz(content, c, subIdx);
    }
  }

  /* ---------- 练习系统 ---------- */
  const norm = s => String(s).trim().toLowerCase().replace(/[\s()（）]/g, '');
  function answerText(q) { return q.type === 'fill' ? [].concat(q.answer)[0] : `${'ABCDEF'[q.answer]}. ${q.options[q.answer]}`; }
  function renderQuiz(root, c, focusIdx) {
    const rec = (store.get()[c.id]) || {};
    root.innerHTML = `
      <div class="quiz-head"><h1>第${c.id}章 · 课后练习</h1><div class="quiz-score" id="qscore"></div><button class="btn btn-sm btn-danger" id="qreset" type="button"><span class="ico ic-reset" aria-hidden="true"></span>重做本章</button></div>
      <div id="qcelebrate"></div>
      ${c.quiz.map((q, i) => `
        <div class="qcard" data-i="${i}" id="q-${i}">
          <div class="qtitle"><span class="qno">${i + 1}</span><span class="qtype">${q.type === 'fill' ? '填空' : '单选'}</span>${q.q}</div>
          ${q.type === 'fill'
            ? `<div class="qfill"><input class="input" placeholder="输入答案，按回车提交" /><button class="btn btn-primary btn-sm" type="button" data-submit>提交</button></div>`
            : `<div class="qopts">${q.options.map((o, k) => `<button class="qopt" type="button" data-k="${k}"><span class="qkey">${'ABCDEF'[k]}</span><span>${o}</span></button>`).join('')}</div>`}
          <div class="qresult" hidden></div>
          <details class="qpeek"><summary>查看答案与解析</summary><div style="margin-top:6px"><b>答案：</b>${answerText(q)}<br>${q.explain}</div></details>
        </div>`).join('')}`;

    const updScore = () => {
      const st = chapterStats(c);
      $('#qscore', root).innerHTML = `<span>答对 <b style="color:var(--fg)">${st.correct}</b> / ${st.total}</span><div class="progress"><span style="width:${pct(st.correct, st.total)}%"></span></div>`;
      $('#qcelebrate', root).innerHTML = st.correct === st.total ? '<div class="celebrate">🎉 本章全部答对！</div>' : '';
      updateCounter();
    };
    const judge = (card, i, val, silent) => {
      const q = c.quiz[i];
      let ok;
      if (q.type === 'fill') {
        ok = [].concat(q.answer).map(norm).includes(norm(val));
      } else {
        ok = val === q.answer;
        $$('.qopt', card).forEach((b, k) => { b.disabled = true; b.classList.toggle('right', k === q.answer); b.classList.toggle('wrong', k === val && !ok); });
      }
      card.classList.toggle('ok', ok); card.classList.toggle('bad', !ok);
      const res = $('.qresult', card); res.hidden = false; res.className = 'qresult ' + (ok ? 'ok' : 'bad');
      res.innerHTML = (ok ? '✅ 回答正确！' : `❌ 回答错误。正确答案：<b>${answerText(q)}</b>`) + `<div class="exp">💡 解析：${q.explain}</div>`;
      $('.qpeek', card).hidden = true;
      if (!silent) { const p = store.get(); p[c.id] = p[c.id] || {}; p[c.id][i] = { ok, v: val }; store.set(p); }
    };
    $$('.qcard', root).forEach(card => {
      const i = +card.dataset.i, q = c.quiz[i];
      if (q.type === 'fill') {
        const inp = $('input', card);
        const go = () => { if (inp.value.trim()) judge(card, i, inp.value); updScore(); };
        $('[data-submit]', card).onclick = go;
        inp.onkeydown = e => { if (e.key === 'Enter') go(); };
        if (rec[i]) { inp.value = rec[i].v; judge(card, i, rec[i].v, true); }
      } else {
        $$('.qopt', card).forEach(b => b.onclick = () => { judge(card, i, +b.dataset.k); updScore(); });
        if (rec[i]) judge(card, i, rec[i].v, true);
      }
    });
    $('#qreset', root).onclick = () => { const p = store.get(); delete p[c.id]; store.set(p); renderQuiz(root, c); };
    updScore();
    if (focusIdx !== undefined) { const t = document.getElementById('q-' + focusIdx); if (t) setTimeout(() => t.scrollIntoView({ behavior: 'smooth', block: 'center' }), 30); }
  }

  let quizFilter = 'all';
  function renderQuizHub() {
    const p = store.get(), items = [];
    CHAPTERS.forEach(c => c.quiz.forEach((q, i) => {
      const r = (p[c.id] || {})[i];
      items.push({ c, q, i, state: !r ? 'open' : r.ok ? 'done' : 'bad' });
    }));
    const cnt = k => items.filter(x => x.state === k).length;
    const shown = items.filter(x => quizFilter === 'all' || x.state === quizFilter);
    main.innerHTML = `
      <div class="page-title"><h1>全部课后练习</h1><span class="muted">点击任意题目直接跳转作答</span></div>
      <div class="box">
        <div class="box-header list-head">
          <button class="ftab ${quizFilter === 'all' ? 'on' : ''}" data-f="all">全部 ${items.length}</button>
          <button class="ftab ${quizFilter === 'open' ? 'on' : ''}" data-f="open">${I.issue} ${cnt('open')} 未作答</button>
          <button class="ftab ${quizFilter === 'done' ? 'on' : ''}" data-f="done">${I.done} ${cnt('done')} 已答对</button>
          <button class="ftab ${quizFilter === 'bad' ? 'on' : ''}" data-f="bad">${I.bad} ${cnt('bad')} 答错</button>
        </div>
        ${shown.map(x => `<div class="list-row">${x.state === 'open' ? I.issue : x.state === 'done' ? I.done : I.bad}
          <div class="lr-main">
            <a class="lr-title" href="#/ch/${x.c.id}/quiz/${x.i}">${x.q.q}</a>
            <div class="lr-meta">第${x.c.id}章 ${esc(x.c.title)} · ${x.q.type === 'fill' ? '填空' : '单选'} · 由 ${esc(x.c.author)} 编写</div>
          </div></div>`).join('') || '<div style="padding:24px;text-align:center" class="muted">暂无题目</div>'}
      </div>`;
    $$('.ftab', main).forEach(b => b.onclick = () => { quizFilter = b.dataset.f; renderQuizHub(); });
  }

  function renderTeam() {
    main.innerHTML = `
      <div class="page-title"><h1>小组分工说明</h1><span class="muted">${TEAM.length} 位成员协作完成</span></div>
      <div class="box">
        <div class="box-header"><span class="ico ic-team" aria-hidden="true"></span><b>成员列表与具体贡献</b></div>
        ${TEAM.map((m, n) => `<div class="list-row">${avatar(m.name, 'lg')}
          <div class="lr-main">
            <span class="lr-title">${esc(m.name)}</span>
            <span class="label" style="background:${m.color}22;color:${m.color};border-color:${m.color}55;margin-left:8px">${esc(m.role)}</span>
            <details open><summary>查看具体贡献</summary><ul>${m.tasks.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>
          </div></div>`).join('')}
      </div>`;
  }

  function renderActions() {
    const p = store.get(), s = allStats();
    const doneCh = CHAPTERS.filter(c => { const t = chapterStats(c, p); return t.correct === t.total; }).length;
    main.innerHTML = `
      <div class="page-title"><h1>Actions · 学习进度</h1><span class="spacer"></span><button class="btn btn-sm btn-danger" id="resetAll" type="button"><span class="ico ic-reset" aria-hidden="true"></span>清空全部进度</button></div>
      <div class="stat-cards">
        <div class="stat-card"><div class="num">${s.answered}<span class="muted" style="font-size:14px"> / ${s.total}</span></div><div class="lbl">已作答题数</div></div>
        <div class="stat-card"><div class="num">${pct(s.correct, s.answered)}%</div><div class="lbl">正确率</div></div>
        <div class="stat-card"><div class="num">${doneCh}<span class="muted" style="font-size:14px"> / ${CHAPTERS.length}</span></div><div class="lbl">全对章节</div></div>
      </div>
      <div class="box">
        <div class="box-header"><b>${CHAPTERS.length} 章节练习状态</b></div>
        ${CHAPTERS.map(c => {
          const t = chapterStats(c, p), rec = p[c.id] || {};
          const icon = !t.answered ? I.idle : t.correct === t.total ? I.ok : t.answered < t.total ? I.pending : I.bad;
          return `<div class="list-row">${icon}
            <div class="lr-main">
              <a class="lr-title" href="#/ch/${c.id}/quiz">第${c.id}章 ${esc(c.title)}</a>
              <div class="lr-meta">已答 ${t.answered}/${t.total} · 答对 ${t.correct} · 负责人 ${esc(c.author)}</div>
              <div class="progress" style="margin-top:6px;max-width:360px"><span style="width:${pct(t.correct, t.total)}%"></span></div>
              <details><summary>查看每题结果</summary><ul class="run-steps">
                ${c.quiz.map((q, i) => `<li>${!rec[i] ? I.idle : rec[i].ok ? I.ok : I.bad}<a href="#/ch/${c.id}/quiz/${i}">${i + 1}. ${q.q}</a></li>`).join('')}
              </ul></details>
            </div>
            <a class="btn btn-sm" href="#/ch/${c.id}/quiz">${t.answered ? '继续' : '开始'}</a></div>`;
        }).join('')}
      </div>`;
    $('#resetAll').onclick = () => { if (confirm('确定清空全部答题记录？')) { store.set({}); lastStudy.clear(); route(); } };
  }

  /* ---------- 搜索 ---------- */
  const searchInput = $('#searchInput'), searchPop = $('#searchPop'), index = [];
  CHAPTERS.forEach(c => c.sections.forEach((s, i) => s.subs.forEach((sb, j) => index.push({ c, i, j, title: sb.title, text: strip(sb.html) }))));
  let searchSel = 0;
  function doSearch() {
    const q = searchInput.value.trim();
    if (!q) { searchPop.hidden = true; return; }
    const ql = q.toLowerCase();
    const res = index.filter(x => (x.title + x.text + x.c.title).toLowerCase().includes(ql)).slice(0, 8);
    searchSel = 0;
    searchPop.innerHTML = res.length ? res.map((x, n) => `<a href="#/ch/${x.c.id}/${x.i}/${x.j}" class="${n === 0 ? 'on' : ''}">
      <div class="s-title">${esc(x.title)}</div><div class="s-snip muted">第${x.c.id}章 · ${esc(x.text.slice(0, 50))}…</div></a>`).join('')
      : `<div class="empty muted">没有找到「${esc(q)}」</div>`;
    searchPop.hidden = false;
  }
  searchInput.oninput = doSearch; searchInput.onfocus = doSearch;
  searchInput.onkeydown = e => {
    const links = $$('a', searchPop);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (links.length) { searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length; links.forEach((a, n) => a.classList.toggle('on', n === searchSel)); } }
    else if (e.key === 'Enter' && links[searchSel]) { location.hash = links[searchSel].getAttribute('href'); searchPop.hidden = true; searchInput.blur(); }
    else if (e.key === 'Escape') { searchPop.hidden = true; searchInput.blur(); }
  };
  searchPop.onclick = e => { if (e.target.closest('a')) searchPop.hidden = true; };
  document.addEventListener('click', e => { if (!e.target.closest('.gh-search')) searchPop.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); searchInput.focus(); } });

  /* ---------- 主题切换（默认 GitHub 深色，支持切换浅色） ---------- */
  const applyTheme = t => {
    document.documentElement.setAttribute('data-theme', t);
    $('#themeBtn').title = t === 'dark' ? '切换到浅色主题' : '切换到深色主题';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  };
  applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
  $('#themeBtn').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

  function updateCounter() { const s = allStats(); $('#quizCounter').textContent = s.total - s.correct; }
  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
    const view = parts[0] || 'code';
    closeDrawer();
    window.scrollTo(0, 0);
    if (view === 'ch') renderChapter(+parts[1], parts[2], parts[3]);
    else if (view === 'quiz') renderQuizHub();
    else if (view === 'team') renderTeam();
    else if (view === 'actions') renderActions();
    else renderHome();
    const tab = view === 'ch' ? (parts[2] === 'quiz' ? 'quiz' : 'code') : view;
    $$('#repoNav a').forEach(a => a.classList.toggle('active', a.dataset.view === tab));
    renderDrawer(view, view === 'ch' ? +parts[1] : null, parts[2]);
    updateCounter();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
